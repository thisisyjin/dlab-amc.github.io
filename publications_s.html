<style>
  .skel-cell-important {
    position: relative;
  }
  .search-input-wrap {
    position: absolute;
    display: flex;
    align-items: center;
    top: 0;
    right: 0;
    transform: translateY(-50%);
    gap: 8px;
  }
  .search-input:focus {
    outline: none !important;
    border: none !important;
  }
  .search-input::placeholder {
    font-size: 15px;
    line-height: normal;
  }
  .search-button {
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    padding: 1rem;
    width: 2.5rem;
    height: 2.5rem;
    background-color: #006065;
    color: #fff;
    font-size: 1rem;
  }
  .search-button:hover {
    background-color: rgb(0, 101, 101);
  }
  .patent-tab {
    display: inline-block;
    padding: 6px 16px;
    border-bottom: 2px solid transparent;
    text-decoration: none;
    color: #999;
    font-size: 1.1em;
  }
  .patent-tab:hover {
    color: #6b6b6b;
  }
  .patent-tab.active {
    color: #036166;
    border-bottom: 2px solid #036166;
    font-weight: 700;
  }
</style>

<script>
  let stateFilter = 'granted';
  let currentSearch = '';

  document.addEventListener('DOMContentLoaded', () => {
    fetch('{{ site.baseurl }}/data/publications/pub_p.json')
      .then((res) => res.json())
      .then((data) => {
        const swData = data.filter((d) => d.class === 'Registered SW');
        const contentEl = document.getElementById('pub-content');

        document.querySelectorAll('.patent-tab').forEach((tab) => {
          tab.addEventListener('click', (e) => {
            e.preventDefault();
            stateFilter = tab.dataset.state;
            document
              .querySelectorAll('.patent-tab')
              .forEach((t) => t.classList.remove('active'));
            tab.classList.add('active');
            render();
          });
        });

        document
          .getElementById('search-button')
          .addEventListener('click', () => {
            currentSearch = document
              .getElementById('search-input')
              .value.trim();
            render();
          });

        document
          .getElementById('search-input')
          .addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              currentSearch = e.target.value.trim();
              render();
            }
          });

        function render() {
          contentEl.innerHTML = '';
          const shown = swData
            .filter((d) => d.patent_state === stateFilter)
            .filter((d) => {
              if (!currentSearch) return true;
              const str = buildHTML(d);
              return str.includes(currentSearch);
            })
            .sort((a, b) => b.date.localeCompare(a.date));

          shown.forEach((entry) => {
            const div = document.createElement('div');
            div.style.marginBottom = '20px';
            const line = document.createElement('div');
            line.className = 'paperclick';
            line.textContent = buildHTML(entry);
            div.appendChild(line);
            contentEl.appendChild(div);
          });
        }

        function buildHTML(entry) {
          const authors = entry.authors_text || '';
          const title = entry.title_kor || entry.title_eng || '';
          const number = entry.number || '';
          const code = entry.country_code || '';
          const date = formatDate(entry.date);
          return (
            [authors, title, `${code} ${number}`, date]
              .filter(Boolean)
              .join('. ') + '.'
          );
        }

        function formatDate(str) {
          if (!str) return '';
          const [y, m, d] = str.split('-');
          return `${y} ${m.padStart(2, '0')} ${parseInt(d || '1')}`;
        }

        render();
      });
  });
</script>
