<style>
  /* 상태 필터 탭 스타일 */
  .patent-tab-container {
    text-align: center;
    margin-top: 1.5em;
  }

  .patent-tab {
    display: inline-block;
    padding: 6px 16px;
    margin: 0 6px;
    border-bottom: 2px solid transparent;
    text-decoration: none;
    color: #999;
    font-size: 1.1em;
  }

  .patent-tab.active {
    color: #036166;
    border-bottom: 2px solid #036166;
    font-weight: 700;
  }
</style>

<script>
  const CLASS_ORDER = ['ALL', 'International', 'Domestic'];
  const ALLOWED_CLASSES = ['International', 'Domestic'];

  document.addEventListener('DOMContentLoaded', () => {
    fetch('{{ site.baseurl }}/data/publications/pub_p.json')
      .then((res) => res.json())
      .then((allData) => {
        const filterContainer = document.getElementById('class-filter');
        const contentContainer = document.getElementById('pub-content');
        let selectedState = 'granted'; // default 탭

        const render = () => {
          // 기존 컨텐츠 비움
          contentContainer.innerHTML = '';

          const filteredData = allData.filter(
            (d) =>
              d.patent_state === selectedState &&
              ALLOWED_CLASSES.includes(d.class)
          );

          const byClass = groupBy(filteredData, 'class');

          CLASS_ORDER.forEach((cls) => {
            const section = document.createElement('div');
            section.className = 'class-section';
            section.id = `section-${cls.toLowerCase()}`;
            section.style.display = cls === 'ALL' ? 'block' : 'none';

            const entries = (
              cls === 'ALL' ? filteredData : [...(byClass[cls] || [])]
            )
              .filter((d) => d.date)
              .sort((a, b) => b.date.localeCompare(a.date));

            entries.forEach((entry) => {
              const div = document.createElement('div');
              div.style.marginBottom = '20px';

              const content = buildPatentHTML(entry);
              const line = document.createElement('div');
              line.className = 'paperclick';
              line.textContent = content;

              div.appendChild(line);
              section.appendChild(div);
            });

            contentContainer.appendChild(section);
          });
        };

        // 클래스 필터 버튼
        CLASS_ORDER.forEach((cls) => {
          const btn = document.createElement('a');
          btn.textContent = cls;
          btn.href = `#${cls.toLowerCase()}`;
          btn.className = 'small-button' + (cls === 'ALL' ? ' active' : '');
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            document
              .querySelectorAll('.class-section')
              .forEach((el) => (el.style.display = 'none'));
            document
              .querySelectorAll('.small-button')
              .forEach((el) => el.classList.remove('active'));
            document.getElementById(
              `section-${cls.toLowerCase()}`
            ).style.display = 'block';
            btn.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
          filterContainer.appendChild(btn);
        });

        // 상태 탭 필터링 (Granted/Filed)
        document.querySelectorAll('.patent-tab').forEach((tab) => {
          tab.addEventListener('click', (e) => {
            e.preventDefault();
            document
              .querySelectorAll('.patent-tab')
              .forEach((el) => el.classList.remove('active'));
            tab.classList.add('active');
            selectedState = tab.dataset.state;
            render();
          });
        });

        render(); // 최초 실행
      });

    function groupBy(arr, key) {
      return arr.reduce((acc, cur) => {
        const k = cur[key] || '기타';
        acc[k] = acc[k] || [];
        acc[k].push(cur);
        return acc;
      }, {});
    }

    function buildPatentHTML(entry) {
      const authors = entry.authors_text || '';
      const title = entry.title_eng || '';
      const country = entry.country_code || '';
      const number = entry.number || '';
      const date = formatDate(entry.date);
      const segments = [];

      if (authors) segments.push(`${authors}.`);
      if (title) segments.push(`${title}.`);
      if (country && number) segments.push(`${country} ${number},`);
      if (date) segments.push(`${date}.`);

      return segments.join(' ').replace(/\s+/g, ' ').trim();
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const normalized = dateStr.replace(/\./g, '-').replace(/\s/g, '').trim();
      const [yyyy, mm, dd] = normalized.split('-');
      const monthNames = [
        '',
        'Jan',
        'Feb',
        'Mar',
        'Apr',
        'May',
        'Jun',
        'Jul',
        'Aug',
        'Sep',
        'Oct',
        'Nov',
        'Dec',
      ];
      const month = monthNames[parseInt(mm, 10)] || '';
      return `${yyyy} ${month} ${parseInt(dd, 10)}`;
    }
  });
</script>
