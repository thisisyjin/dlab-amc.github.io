name: Deploy Members

on:
  push:
    paths:
      - 'data/members/members.zip'

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip members.zip
        run: |
          unzip -o data/members/members.zip -d data/members/

      - name: Commit and Push
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add data/members/
          git commit -m "[AUTO] Unzipped members.zip and updated data/members/" || echo "No changes"
          git push
